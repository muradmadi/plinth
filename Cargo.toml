[package]
name = "plinth"
version = "0.9.0"
edition = "2024"
description = "Set up the tooling around a project and its GitHub repo, the same way every time"
license = "MIT"
repository = "https://github.com/muradmadi/plinth"
# Released as binaries on GitHub, not to crates.io, where the name is taken.
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
minijinja = "3.0.3"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
