# One grouped PR per ecosystem per month, so updates arrive as a batch to review, not a stream.
# Titles are Conventional Commits, build(deps): and ci(deps):, which don't make a release.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
