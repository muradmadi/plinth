# After each merge to main, release-please keeps one PR open that bumps the project's version
# and adds the feat and fix titles since the last release to CHANGELOG.md. Merging it tags the
# commit and publishes a GitHub Release.
#
# It works with the job token (the repo lets Actions open PRs). GitHub holds the workflows on a PR
# the job token opened until someone approves them, so on the release PR click "Approve workflows
# to run" once; its `check` then runs and the ruleset lets it merge.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
