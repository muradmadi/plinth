# Every PR and every push to main runs the gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the rust and just versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: just ci
