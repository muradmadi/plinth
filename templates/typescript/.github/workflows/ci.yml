# Every PR and every push to main runs the gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, so it needs the whole history.
          fetch-depth: 0
          persist-credentials: false
      # Installs node, just and the audit tools pinned in mise.toml.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: just ci
        env:
          # zizmor's online audits check that pinned actions exist and have no known advisories.
          GH_TOKEN: ${{ github.token }}
