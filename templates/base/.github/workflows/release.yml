# After each merge to main, release-please keeps one PR open that bumps the project's version
# and adds the feat and fix titles since the last release to CHANGELOG.md. Merging it tags the
# commit and publishes a GitHub Release.
#
# It works with the job token (the repo lets Actions open PRs). GitHub starts no workflow from a PR
# the job token opened or updated, so the step below starts ci.yml on the release PR's branch; its
# `check` counts for the ruleset like any other run. Every language's CI is ci.yml, which accepts
# workflow_dispatch for this.
#
# A project that ships something with each release (binaries, an image, a deploy) does it in
# .github/workflows/publish.yml, started below on the new tag. GitHub starts no workflow from a
# release or tag the job token made, so publish.yml can't simply listen for them.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release commit, tag and GitHub Release
      pull-requests: write # the release PR
      issues: write # labels on the release PR
      actions: write # gh workflow run, for ci.yml and publish.yml
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Run CI on the release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Start publish.yml on the new tag
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if gh workflow view publish.yml --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          fi
