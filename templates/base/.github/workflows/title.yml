# The squash takes the PR title as the commit on main, and release-please reads those commits to
# choose the next version. This refuses a title that isn't a Conventional Commit. It runs again when
# the title is edited.
name: title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ]'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "$TITLE"
          else
            echo "::error::\"$TITLE\" isn't a Conventional Commit. Use type: description, such as \"feat: add a dark mode\". AGENTS.md lists the types."
            exit 1
          fi
